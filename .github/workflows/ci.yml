name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `checks` runs build first: tsc reads the generated dist/tokens.ts.
      - run: bun install --frozen-lockfile
      - run: bun run checks
